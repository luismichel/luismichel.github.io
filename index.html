<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis Michel | Developer</title>
    <link rel="stylesheet" type="text/css" href="reset.css">
    <link rel="stylesheet" type="text/css" href="cyberpunk.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
    <!-- WebGL Canvas for shader effects -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Cryptic message overlay -->
    <div class="abyss-message">
        <div class="abyss-text">
            <p class="japanese-warning">システム崩壊</p>
            <p class="japanese-subtitle">二度クリックして再起動</p>
        </div>
    </div>

    <!-- System Status Indicator -->
    <div class="status-indicator">
        <span class="status-label">SYS:</span>
        <span class="status-value">STABLE</span>
    </div>

    <div class="scanlines"></div>
    <div class="background-grid"></div>

    <!-- Scrolling background text (Pi movie inspired) -->
    <div class="pi-text-scroll"></div>

    <!-- Glitch Terminal -->
    <div class="glitch-terminal">
        <div class="terminal-content">
            <span class="terminal-prompt">root@system:~$</span>
            <span class="terminal-input"></span>
            <span class="terminal-cursor">_</span>
        </div>
    </div>

    <div class="container">
        <!-- Floating particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- Main content -->
        <div class="content">
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="LUIS MICHEL">LUIS MICHEL</h1>
            </div>

            <div class="subtitle-container">
                <p class="subtitle glitch-text" data-text="[ DEVELOPER ]">[ DEVELOPER ]</p>
            </div>

            <div class="bio">
                <p class="bio-text">
                    <span class="cursor-blink">></span> Building digital experiences in the void
                </p>
                <p class="bio-text">
                    <span class="cursor-blink">></span> Architecting the future, one line at a time
                </p>
            </div>

            <div class="contact-section">
                <div class="contact-line">
                    <span class="prompt">root@cyberspace:~$</span>
                    <span class="command">contact</span>
                </div>
                <div class="contact-box">
                    <a href="mailto:me@luismichel.dev" class="email-link glitch-link" data-text="me@luismichel.dev">
                        me@luismichel.dev
                    </a>
                </div>
            </div>

            <div class="matrix-code"></div>
        </div>

        <!-- Animated borders -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
    </div>

    <script src="cyberpunk.js"></script>
</body>
</html>
